SPECIFICATION Spec

\* Probe-first stale recovery is present, but no advisory lock spans bind ->
\* listen. Two starters can both probe: daemon A binds but is not listening,
\* daemon B observes ECONNREFUSED, treats A's path as stale, unlinks it, and
\* binds a replacement. A is stranded when it later publishes listen.
CONSTANTS
    Daemons = {"a", "b"}
    MaxLifecycles = 2
    UnconditionalUnlink = FALSE
    SerializedStartup = FALSE
    InodeValidatedCleanup = TRUE

INVARIANTS
    ServingDaemonOwnsPath
    AtMostOneServing
    AtMostOneBoundSocket
