\* Trace-conformance run for TraceControlChannel. The daemon's control-channel
\* traces (generated into TraceControlData by scripts/check-trace) must replay
\* as valid LabptyControlChannel behaviours: each logged transition is the
\* labelled spec action and the safety invariants hold on every state.
\* EstablishOnAnyRoundTrip = FALSE / ExpireIgnoresMidFrame = FALSE is the
\* CORRECT spec (2aac41a); the negative control (-DLABPTY_TRACE_NEGCTL) marks a
\* rejected client established and must fail against it.
\*
\* Run WITHOUT -deadlock so a logged transition that matches no labelled spec
\* action is reported as a deadlock before the trace is consumed. The
\* end-of-trace absorb step keeps a conformant run deadlock-free.
SPECIFICATION TSpec

CONSTANT
    Clients <- TraceClients
    MaxFramesPerClient = 10
    EstablishOnAnyRoundTrip = FALSE
    ExpireIgnoresMidFrame = FALSE

INVARIANT EstablishedImpliesNegotiated
INVARIANT EmptyImpliesClean
INVARIANT InUseIffNotEmpty
INVARIANT EstablishedRequiresInUse
INVARIANT NegotiatedRequiresInUse
INVARIANT TraceIndexInRange
