\* Trace-conformance run for TraceReuse. The daemon's registry lifecycle traces
\* (generated into TraceReuseData by scripts/check-trace) must replay as valid
\* LabptyReuse behaviours: each logged transition is an OpenSession / Terminate
\* / DaemonReap and the reuse safety invariants hold on every state. Fixed =
\* TRUE is the CORRECT spec (terminate relinquishes the id); the negative
\* control (-DLABPTY_TRACE_NEGCTL) retains the id and must fail against it.
\*
\* Run WITHOUT -deadlock so a logged transition that matches no spec action
\* (the conjoined Allowed blocks it) is reported as a deadlock before the trace
\* is consumed. The end-of-trace absorb step keeps a conformant run
\* deadlock-free.
SPECIFICATION TSpec

CONSTANT
    MaxSessions <- TraceMaxSessions
    Ids <- TraceIds
    Fixed = TRUE

INVARIANT NotAliveImpliesIdRelinquished
INVARIANT TerminatedIdIsReusable
INVARIANT FreeSlotIsClean
INVARIANT ClosePendingImpliesNotAlive
INVARIANT TraceIndexInRange
