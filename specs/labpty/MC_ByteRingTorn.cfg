SPECIFICATION Spec

\* ReadableWindow = Capacity reproduces the pre-margin behavior: the
\* reader's window covers every cell, and a single in-flight write can
\* overwrite a cell the reader is concurrently reading.
CONSTANTS
    Capacity       = 4
    ReadableWindow = 4
    MaxWriteSize   = 2
    MaxWrites      = 8

INVARIANTS
    TypeOK
    NoTornRead
