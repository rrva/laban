SPECIFICATION Spec

\* Positive: the fix is in (Fixed = TRUE) — terminate relinquishes the id.
\* A terminated logical_id is immediately reusable and no close_pending slot
\* retains one, so TLC verifies both the mechanism invariant and the contract.
CONSTANTS
    MaxSessions = 2
    Ids         = {"a"}
    Fixed       = TRUE

INVARIANTS
    TypeOK
    FreeSlotIsClean
    ClosePendingImpliesNotAlive
    NotAliveImpliesIdRelinquished
    TerminatedIdIsReusable
