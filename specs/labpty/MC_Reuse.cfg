SPECIFICATION Spec

\* Positive: the 389df73 fix is in (Fixed = TRUE). A terminated logical_id is
\* immediately reusable, so TLC verifies TerminatedIdIsReusable.
CONSTANTS
    MaxSessions = 2
    Ids         = {"a"}
    Fixed       = TRUE

INVARIANTS
    TypeOK
    FreeSlotIsClean
    ClosePendingImpliesNotAlive
    TerminatedIdIsReusable
