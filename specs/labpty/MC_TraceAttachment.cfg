\* Trace-conformance run for TraceAttachment. The daemon's attachment trace
\* (generated into TraceData by scripts/check-trace) must replay as a valid
\* LabptyAttachment behaviour: each logged transition is a spec action and the
\* safety invariants hold on every observed state. The scrub is ON
\* (TeardownSkipsAttachmentScrub = FALSE) — this is the CORRECT spec; the
\* negative-control trace (-DLABPTY_TRACE_NEGCTL) is what must fail against it.
\*
\* Run WITHOUT -deadlock so a logged transition that matches no spec action
\* (the conjoined Next blocks it) is reported as a deadlock before the trace is
\* consumed. The end-of-trace absorb step keeps a conformant run deadlock-free.
SPECIFICATION TSpec

CONSTANT
    Clients <- TraceClients
    Sessions <- TraceSessions
    TeardownSkipsAttachmentScrub = FALSE

INVARIANT AttachmentImpliesInUse
INVARIANT AttachmentImpliesAlive
INVARIANT CountWithinBounds
INVARIANT TraceIndexInRange
