SPECIFICATION Spec

\* Two clients and two sessions is the minimum that exercises the
\* interesting interleavings: two owners on one session (count = 2), one
\* client attached to both sessions at once (so a disconnect must scrub
\* both masks), and slot reuse (terminate a session, reopen its id).
\* TeardownSkipsAttachmentScrub = FALSE is the current C behaviour:
\* client_release scrubs the departing client from every session.
CONSTANTS
    Clients = {"c1", "c2"}
    Sessions = {"s1", "s2"}
    TeardownSkipsAttachmentScrub = FALSE

INVARIANTS
    TypeOK
    AttachmentImpliesInUse
    AttachmentImpliesAlive
    CountWithinBounds
