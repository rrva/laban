SPECIFICATION Spec

\* Capacity = 4 cells, MaxWriteSize = 2, MaxWrites = 8 (two laps of a
\* full-size write at the boundary). ReadableWindow = 2 = Capacity -
\* MaxWriteSize, which is the minimum safe margin for this configuration:
\* an in-flight write of MaxWriteSize bytes cannot collide with the
\* reader's window of ReadableWindow bytes when their sum equals Capacity.
CONSTANTS
    Capacity       = 4
    ReadableWindow = 2
    MaxWriteSize   = 2
    MaxWrites      = 8

INVARIANTS
    TypeOK
    NoTornRead
    WindowDoesNotContainFutureWrites
