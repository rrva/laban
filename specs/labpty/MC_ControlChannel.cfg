SPECIFICATION Spec

\* Two clients is the minimum that exercises the interleaving where one
\* slot is in the slowloris-leak state while the other cycles normally;
\* MaxFramesPerClient = 2 lets each slot complete a full round-trip and
\* attempt a second. EstablishOnAnyRoundTrip = FALSE is the post-2aac41a
\* (correct) behaviour: established' := negotiated.
CONSTANTS
    Clients = {"c1", "c2"}
    MaxFramesPerClient = 2
    EstablishOnAnyRoundTrip = FALSE
    ExpireIgnoresMidFrame   = FALSE

INVARIANTS
    TypeOK
    EmptyImpliesClean
    InUseIffNotEmpty
    EstablishedRequiresInUse
    NegotiatedRequiresInUse
    EstablishedImpliesNegotiated

PROPERTIES
    UnnegotiatedIdleIsNotPermanent
    StuckMidFrameIsNotPermanent
