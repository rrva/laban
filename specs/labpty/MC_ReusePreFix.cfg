SPECIFICATION Spec

\* Negative control: the fix is NOT in (Fixed = FALSE) — open rejects any
\* same-id holder, including one still in its async close window. TLC must
\* find a state where a terminated logical_id cannot be reopened though no
\* live session holds it: the SESSION_ID_IN_USE bug 389df73 fixed.
CONSTANTS
    MaxSessions = 2
    Ids         = {"a"}
    Fixed       = FALSE

INVARIANTS
    TerminatedIdIsReusable
