SPECIFICATION Spec

\* Boundary probe: margin = 1, but MaxWriteSize = 2. Reader's window
\* overlaps the writer's in-flight memcpy region by one byte under wrap.
\* TLC should produce a torn-read counterexample, confirming the
\* margin ≥ MaxWriteSize requirement.
CONSTANTS
    Capacity       = 4
    ReadableWindow = 3
    MaxWriteSize   = 2
    MaxWrites      = 8

INVARIANTS
    TypeOK
    NoTornRead
