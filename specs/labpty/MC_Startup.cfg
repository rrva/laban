SPECIFICATION Spec

\* Two daemons is the smallest configuration that exposes the
\* startup-race state space; MaxLifecycles = 2 lets a daemon Listen,
\* die, and Listen again (covering the stale-recovery branch (c) of
\* Listen_Fixed). UnconditionalUnlink = FALSE is the post-b5e7819
\* (correct) probe-first behaviour.
CONSTANTS
    Daemons = {"a", "b"}
    MaxLifecycles = 2
    UnconditionalUnlink = FALSE
    InodeValidatedCleanup = TRUE

INVARIANTS
    TypeOK
    ServingDaemonOwnsPath
    AtMostOneServing
    BoundImpliesListening
    LifecyclesBounded
