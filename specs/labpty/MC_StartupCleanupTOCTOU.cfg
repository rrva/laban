SPECIFICATION Spec

\* Pins the cleanup-TOCTOU strand: the probe-first Listen fix is in
\* place (UnconditionalUnlink = FALSE), but cleanup_daemon does the
\* old unconditional unlink (InodeValidatedCleanup = FALSE). TLC
\* should reach a state where daemon B is listening with bound = TRUE
\* but dir_entry = "none" because A's UnlinkPath fired after B's
\* stale-recovery rebind.
CONSTANTS
    Daemons = {"a", "b"}
    MaxLifecycles = 2
    UnconditionalUnlink = FALSE
    SerializedStartup = TRUE
    InodeValidatedCleanup = FALSE

INVARIANTS
    ServingDaemonOwnsPath
    AtMostOneServing
