name: check

on:
  push:
    branches: [main]
  pull_request:

# Ghostty commit pinned in scripts/fetch-libghostty-vt. Bump this when that
# pin changes so the cache key invalidates.
env:
  GHOSTTY_COMMIT: 46d54ed673a004df09078bee56e809421a82370e
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache swift-format binary
        id: cache-fmt
        uses: actions/cache@v5
        with:
          path: ~/swift-format-bin
          key: swift-format-602-${{ runner.os }}-${{ runner.arch }}

      - name: Install swift-format
        if: steps.cache-fmt.outputs.cache-hit != 'true'
        run: |
          brew install swift-format
          mkdir -p "$HOME/swift-format-bin"
          cp "$(brew --prefix)/bin/swift-format" "$HOME/swift-format-bin/"

      - name: Add swift-format to PATH
        run: echo "$HOME/swift-format-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swift-format lint --strict --recursive --parallel Sources Tests

  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # actions/checkout sets every file's mtime to extraction time, which
      # invalidates SwiftPM's cached build.db (it records absolute input
      # mtimes from when the cache was created). Setting each tracked file's
      # mtime to its last-commit time is deterministic across runs.
      - name: Restore source mtimes
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(
              ["git", "log", "--pretty=format:%ct", "--name-only"],
              capture_output=True, text=True, check=True,
          ).stdout
          ts = None
          mtimes = {}
          for line in out.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.isdigit():
                  ts = int(line)
              elif line not in mtimes:
                  mtimes[line] = ts
          for path, t in mtimes.items():
              try:
                  os.utime(path, (t, t))
              except FileNotFoundError:
                  pass
          PY

      - name: Cache libghostty-vt artifact
        id: cache-vt
        uses: actions/cache@v5
        with:
          path: .external/libghostty-vt/zig-out
          key: libghostty-vt-zigout-${{ runner.os }}-${{ runner.arch }}-${{ env.GHOSTTY_COMMIT }}

      - name: Install Zig 0.15
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: brew install zig@0.15

      - name: Fetch and build libghostty-vt
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: ./scripts/fetch-libghostty-vt

      - name: Cache SwiftPM build
        id: cache-swiftpm
        uses: actions/cache@v5
        with:
          path: .build
          key: swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: |
            swiftpm-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build
