name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint + build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Fetch and build libghostty-vt
        run: ./scripts/fetch-libghostty-vt

      - name: Lint (swift-format)
        run: ./scripts/lint

      - name: Build
        run: swift build
