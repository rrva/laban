name: check

on:
  push:
    branches: [main]
  pull_request:

# Ghostty commit pinned in scripts/fetch-libghostty-vt. Bump this when that
# pin changes so the cache key invalidates.
env:
  GHOSTTY_COMMIT: 46d54ed673a004df09078bee56e809421a82370e
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache swift-format binary
        id: cache-fmt
        uses: actions/cache@v5
        with:
          path: ~/swift-format-bin
          key: swift-format-602-${{ runner.os }}-${{ runner.arch }}

      - name: Install swift-format
        if: steps.cache-fmt.outputs.cache-hit != 'true'
        run: |
          brew install swift-format
          mkdir -p "$HOME/swift-format-bin"
          cp "$(brew --prefix)/bin/swift-format" "$HOME/swift-format-bin/"

      - name: Add swift-format to PATH
        run: echo "$HOME/swift-format-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swift-format lint --strict --recursive --parallel Sources Tests

  build:
    name: build
    # FrameProducer's glyph fast path uses Span/UTF8Span (Swift 6.2+, macOS 26
    # SDK), gated at runtime with @available(macOS 26, *). The default Xcode on
    # the macos-15 image is 16.4 (Swift 6.1) and lacks those symbols, so the
    # build needs the macos-26 image, whose default Xcode (26.x) ships them.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # actions/checkout sets every file's mtime to extraction time, which
      # invalidates SwiftPM's cached build.db (it records absolute input
      # mtimes from when the cache was created). Setting each tracked file's
      # mtime to its last-commit time is deterministic across runs.
      - name: Restore source mtimes
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(
              ["git", "log", "--pretty=format:%ct", "--name-only"],
              capture_output=True, text=True, check=True,
          ).stdout
          ts = None
          mtimes = {}
          for line in out.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.isdigit():
                  ts = int(line)
              elif line not in mtimes:
                  mtimes[line] = ts
          for path, t in mtimes.items():
              try:
                  os.utime(path, (t, t))
              except FileNotFoundError:
                  pass
          PY

      - name: Cache libghostty-vt artifact
        id: cache-vt
        uses: actions/cache@v5
        with:
          path: .external/libghostty-vt/zig-out
          key: libghostty-vt-zigout-${{ runner.os }}-${{ runner.arch }}-${{ env.GHOSTTY_COMMIT }}

      - name: Install Zig 0.15
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: brew install zig@0.15

      - name: Fetch and build libghostty-vt
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: ./scripts/fetch-libghostty-vt

      - name: Cache SwiftPM build
        id: cache-swiftpm
        uses: actions/cache@v5
        with:
          path: .build
          # v4: the runner moved from macos-15 (Xcode 16.4) to macos-26 (Xcode
          # 26.x); a .build compiled by the old toolchain must not be restored
          # onto the new one.
          key: swiftpm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: |
            swiftpm-v4-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The stress suite is intentionally skipped by a plain `swift test`.
      # Keep one deterministic bounded soak in CI so the real C writer's
      # wraparound, heartbeat, client churn, and teardown paths are gated.
      - name: Labpty stress
        env:
          LABPTY_STRESS: "1"
          LABPTY_STRESS_DURATION_S: "10"
          LABPTY_STRESS_MIN_CYCLES: "500"
          LABPTY_STRESS_SEED: "20260717"
        run: swift test --filter LabptyStressTests

  labpty-verification:
    name: labpty verification
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install CBMC
        run: brew install cbmc

      - name: Fetch checksum-pinned TLA+ tools
        env:
          TLA_TOOLS_SHA1: 9416f74257aa50f250776db34964db7ec99e9883
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.1/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          printf '%s  %s\n' "$TLA_TOOLS_SHA1" "$RUNNER_TEMP/tla2tools.jar" \
            | shasum -a 1 --check
          echo "TLA_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Check formal wiring
        run: ./scripts/check-anchors

      - name: Check TLA+ state machines
        run: ./scripts/check-specs

      - name: Check CBMC decoder proofs
        run: ./scripts/check-cbmc

      - name: Check runtime trace conformance
        run: ./scripts/check-trace

      - name: Check trace model coverage
        run: ./scripts/check-model-coverage
