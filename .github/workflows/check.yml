name: check

on:
  push:
    branches: [main]
  pull_request:

# Ghostty commit pinned in scripts/fetch-libghostty-vt. Bump this when that
# pin changes so the cache key invalidates.
env:
  GHOSTTY_COMMIT: fdb6e3d2c8543e2e756b7e07f44372efbc0fba4b
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache swift-format binary
        id: cache-fmt
        uses: actions/cache@v4
        with:
          path: ~/swift-format-bin
          key: swift-format-602-${{ runner.os }}-${{ runner.arch }}
          save-always: true

      - name: Install swift-format
        if: steps.cache-fmt.outputs.cache-hit != 'true'
        run: |
          brew install swift-format
          mkdir -p "$HOME/swift-format-bin"
          cp "$(brew --prefix)/bin/swift-format" "$HOME/swift-format-bin/"

      - name: Add swift-format to PATH
        run: echo "$HOME/swift-format-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swift-format lint --strict --recursive --parallel Sources Tests

  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache libghostty-vt artifact
        id: cache-vt
        uses: actions/cache@v4
        with:
          path: .external/libghostty-vt/zig-out
          key: libghostty-vt-zigout-${{ runner.os }}-${{ runner.arch }}-${{ env.GHOSTTY_COMMIT }}
          save-always: true

      - name: Install Zig 0.15
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: brew install zig@0.15

      - name: Fetch and build libghostty-vt
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: ./scripts/fetch-libghostty-vt

      - name: Cache SwiftPM build
        id: cache-swiftpm
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: |
            swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-

      # actions/checkout sets source mtimes to extraction time, which is newer
      # than the cached .build artifacts. SwiftPM/llbuild stores absolute build
      # times in build.db and rebuilds anything whose input is now newer than
      # the recorded "built at" time. Backdating sources to a fixed past time
      # makes them deterministically older than any cached artifact.
      - name: Backdate sources
        if: hashFiles('.build/build.db') != ''
        run: find Package.swift Sources -exec touch -t 202001010000 {} +

      - name: Build
        run: swift build
